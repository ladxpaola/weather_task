services:
  postgres:
    image: postgres:15-trixie
    container_name: weather-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d weather_db"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 5s
    environment:
      POSTGRES_DB: weather_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: user


  weather-app:
    image: weather-app:latest
    container_name: weather-app
    build:
      dockerfile: Dockerfile
      context: .
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy